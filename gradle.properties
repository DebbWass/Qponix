# ─── Gradle JVM Memory ───
# הגדלת heap ל-Gradle daemon — פותר OutOfMemoryError בעת build עם Hilt+Compose
org.gradle.jvmargs=-Xmx4g -Xms512m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# ─── Build Performance ───
# הפעלת parallel builds
org.gradle.parallel=true
# שמירת cache בין builds
org.gradle.caching=true
# הפעלת configuration cache
org.gradle.configuration-cache=true

# ─── Android ───
android.useAndroidX=true
# R8 full mode — shrinking טוב יותר ב-release
android.enableR8.fullMode=true

# ─── Kotlin ───
kotlin.code.style=official
