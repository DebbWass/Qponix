[versions]
agp              = "8.13.2"
kotlin           = "2.0.21"
ksp              = "2.0.21-1.0.27"
hilt             = "2.52"
compose-bom      = "2024.09.00"
activity-compose = "1.9.2"
lifecycle        = "2.8.7"
navigation       = "2.8.3"
room             = "2.6.1"
coroutines       = "1.8.1"
datastore        = "1.1.1"
core-ktx         = "1.13.1"
androidx-hilt    = "1.2.0"
work             = "2.9.1"
# — Testing —
junit            = "4.13.2"
turbine          = "1.1.0"
robolectric      = "4.14.1"
mockk            = "1.13.13"
androidx-test-core = "1.6.1"
androidx-test-junit = "1.2.1"
espresso         = "3.6.1"

[libraries]
# — Compose —
compose-bom             = { group = "androidx.compose", name = "compose-bom", version.ref = "compose-bom" }
compose-ui              = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics     = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-ui-tooling      = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-material3       = { group = "androidx.compose.material3", name = "material3" }
compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
compose-ui-test-junit4  = { group = "androidx.compose.ui", name = "ui-test-junit4" }
compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }

# — Activity & Lifecycle —
activity-compose        = { group = "androidx.activity", name = "activity-compose", version.ref = "activity-compose" }
lifecycle-runtime-ktx   = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }

# — Navigation —
navigation-compose      = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation" }

# — Room —
room-runtime            = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-ktx                = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
room-compiler           = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
room-testing            = { group = "androidx.room", name = "room-testing", version.ref = "room" }

# — Hilt —
hilt-android            = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-android-compiler   = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "androidx-hilt" }
hilt-work               = { group = "androidx.hilt", name = "hilt-work", version.ref = "androidx-hilt" }
hilt-compiler           = { group = "androidx.hilt", name = "hilt-compiler", version.ref = "androidx-hilt" }

# — Coroutines —
coroutines-android      = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
coroutines-test         = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }

# — DataStore / Core / WorkManager —
datastore-preferences   = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
core-ktx                = { group = "androidx.core", name = "core-ktx", version.ref = "core-ktx" }
work-runtime-ktx        = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }
work-testing            = { group = "androidx.work", name = "work-testing", version.ref = "work" }

# — Testing —
junit                   = { group = "junit", name = "junit", version.ref = "junit" }
turbine                 = { group = "app.cash.turbine", name = "turbine", version.ref = "turbine" }
robolectric             = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
mockk                   = { group = "io.mockk", name = "mockk", version.ref = "mockk" }
androidx-test-core-ktx  = { group = "androidx.test", name = "core-ktx", version.ref = "androidx-test-core" }
androidx-test-junit     = { group = "androidx.test.ext", name = "junit", version.ref = "androidx-test-junit" }
androidx-test-junit-ktx = { group = "androidx.test.ext", name = "junit-ktx", version.ref = "androidx-test-junit" }
espresso-core           = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }

[plugins]
android-application = { id = "com.android.application",       version.ref = "agp"    }
kotlin-android      = { id = "org.jetbrains.kotlin.android",  version.ref = "kotlin" }
kotlin-compose      = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
hilt-android        = { id = "com.google.dagger.hilt.android", version.ref = "hilt"  }
ksp                 = { id = "com.google.devtools.ksp",        version.ref = "ksp"   }
